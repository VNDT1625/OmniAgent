name = "aionui-cloud-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "WORKSPACE_ROOMS"
class_name = "WorkspaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceRoom"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "aionui-cloud-relay-blobs"

# Optional metadata store for workspace lists/auth. The v1 worker keeps the
# realtime manifest/op log in Durable Object storage and uses D1 only when you
# later add account/workspace management.
