[package]
name = "mtui"
version = "0.1.0"
edition = "2021"
description = "Memory Terminal UI - deterministic backend terminal and file-operation layer"

[[bin]]
name = "mtui"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
similar = "2"
ignore = "0.4"
walkdir = "2"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.8"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
